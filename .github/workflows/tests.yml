name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - name: Paket derlenebiliyor mu
        run: |
          pip install build
          python -m build
          pip install "dist/$(ls dist | grep whl)[mcp]"
          cd /tmp && enerji-takip --help >/dev/null && python -c "import enerji_takip.mcp_server"
