# Enerji mevzuatı kaynakları
# ------------------------------------------------------------------
# Yeni kaynak eklemek için bir kayıt ekleyin. Çalışma durumu (son başarılı
# kontrol, hata, erişilebilirlik) veri tabanında tutulur.
#
# method:
#   rg_fihrist    Resmî Gazete günlük fihrist sayfaları
#   html_listing  Kurum duyuru listesi; yeni bağlantılar yeni kayıt sayılır
#   rss           RSS/Atom akışı
#
# Doğrulama notu (23.10.2026): Liste adresleri ve bağlantı kalıpları sitelerin o
# tarihteki sayfalarından doğrulandı. Kendi bağlantınızdan kontrol için:
#   enerji-takip check-sources --all

sources:
  - key: resmi_gazete
    name: Resmî Gazete
    url: https://www.resmigazete.gov.tr/
    category: Birincil kaynak
    method: rg_fihrist
    primary: true
    notes: >
      Kanun, CB kararı, yönetmelik, tebliğ ve EPDK kurul kararlarının birincil yayın yeri.
      RSS/API yok; fihrist + belge HTML/PDF'leri taranır.

  - key: epdk_duyurular
    name: EPDK – Duyurular
    url: https://www.epdk.gov.tr/Detay/Icerik/4-0-1/duyurular
    category: Düzenleyici kurum
    method: html_listing
    config:
      list_urls: [https://www.epdk.gov.tr/Detay/Icerik/4-0-1/duyurular]
      item_link_pattern: 'epdk\.gov\.tr/Detay/Icerik/4-\d+/'
      exclude_title_pattern: 'Personel Alım|Sınav|Aylık İstatistik|Sektör Rapor'
      doc_type: DUYURU
      institution: Enerji Piyasası Düzenleme Kurumu

  - key: epias_elektrik_duyurulari
    name: EPİAŞ – Elektrik Piyasası Duyuruları
    url: https://www.epias.com.tr/spot-elektrik-piyasasi/elektrik-piyasasi-duyurulari
    category: Piyasa işletmecisi
    method: html_listing
    notes: Aylık uzlaştırma bildirimleri, planlı bakım ve teminat takvimi gibi rutin duyurular hariç tutulur.
    config:
      list_urls: [https://www.epias.com.tr/spot-elektrik-piyasasi/elektrik-piyasasi-duyurulari]
      item_link_pattern: 'epias\.com\.tr/(tum-duyurular|genel)/.+'
      exclude_title_pattern: 'Uzlaştırma Bildirimi|Planlı Bakım|Bakım Çalışması|Serbest Tüketici Hareketleri|Teminat Hesaplamaları|Organize YEK-G Piyasası$|Eğitim|Personel'
      doc_type: DUYURU
      institution: Enerji Piyasaları İşletme A.Ş.

  - key: epias_dogalgaz_duyurulari
    name: EPİAŞ – Doğal Gaz Piyasası Duyuruları
    url: https://www.epias.com.tr/spot-dogal-gaz-piyasasi/dogal-gaz-piyasasi-duyurulari
    category: Piyasa işletmecisi
    method: html_listing
    enabled: false
    status_if_disabled: dogrulanmadi
    notes: Adres EPİAŞ menüsünden doğrulandı; liste yapısı elektrik sayfasıyla aynı varsayıldı. check-sources --all ile ✔ görürseniz etkinleştirin.
    config:
      list_urls: [https://www.epias.com.tr/spot-dogal-gaz-piyasasi/dogal-gaz-piyasasi-duyurulari]
      item_link_pattern: 'epias\.com\.tr/(tum-duyurular|genel)/.+'
      exclude_title_pattern: 'Uzlaştırma Bildirimi|Planlı Bakım|Bakım Çalışması|Teminat Hesaplamaları|Eğitim|Personel'
      doc_type: DUYURU
      institution: Enerji Piyasaları İşletme A.Ş.

  - key: epias_cevresel_duyurulari
    name: EPİAŞ – Çevresel Piyasalar (YEK-G, karbon) Duyuruları
    url: https://www.epias.com.tr/cevresel-piyasalar/cevresel-piyasa-duyurulari
    category: Piyasa işletmecisi
    method: html_listing
    enabled: false
    status_if_disabled: dogrulanmadi
    notes: Adres EPİAŞ menüsünden doğrulandı; liste yapısı doğrulanmadı. check-sources --all ile kontrol edip etkinleştirin.
    config:
      list_urls: [https://www.epias.com.tr/cevresel-piyasalar/cevresel-piyasa-duyurulari]
      item_link_pattern: 'epias\.com\.tr/(tum-duyurular|genel)/.+'
      exclude_title_pattern: 'Organize YEK-G Piyasası$|Planlı Bakım|Eğitim|Personel'
      doc_type: DUYURU
      institution: Enerji Piyasaları İşletme A.Ş.

  - key: etkb_duyurular
    name: Enerji ve Tabii Kaynaklar Bakanlığı – Duyurular
    url: https://enerji.gov.tr/medya-duyurular-liste
    category: Bakanlık
    method: html_listing
    notes: Tek tek santral imar planı duyuruları hariç tutulur; YEKA ve lisanssız üretim duyuruları kalır.
    config:
      list_urls: [https://enerji.gov.tr/medya-duyurular-liste]
      item_link_pattern: 'enerji\.gov\.tr/duyuru-detay\?id=\d+'
      exclude_title_pattern: 'İmar Planı|Personel|Sınav'
      title_min_length: 8
      doc_type: DUYURU
      institution: Enerji ve Tabii Kaynaklar Bakanlığı

  - key: etkb_mevzuat_rss
    name: ETKB – Mevzuat RSS akışı
    url: https://enerji.gov.tr/RSS/15?t=1
    category: Bakanlık
    method: rss
    enabled: false
    status_if_disabled: devre_disi
    notes: >
      Kapalı. 24.10.2026'da GitHub Actions'tan alınan akışta 100 kayıt vardı ama kayıtlarda bağlantı (link)
      yoktu: yalnızca başlık, açıklama ve yayım tarihi (çoğu proje/ÇED duyurusu). Resmî bağlantı olmadan rapora
      alınamaz. Aynı adres başka zamanlarda bağlantılı mevzuat kayıtları da döndürdü; içerik değişken. ETKB
      duyuruları HTML listesinden zaten izleniyor. Akış düzelirse enabled: true yapın.
    config:
      feed_urls: ['https://enerji.gov.tr/RSS/15?t=1']
      doc_type: DUYURU
      institution: Enerji ve Tabii Kaynaklar Bakanlığı

  - key: teias_duyurular
    name: TEİAŞ – Duyurular
    url: https://www.teias.gov.tr/duyurular
    category: İletim sistemi işletmecisi
    method: html_listing
    notes: Kapasite mekanizması, yan hizmetler, lisanssız kapasite tahsisleri gibi duyurular.
    config:
      list_urls: [https://www.teias.gov.tr/duyurular]
      item_link_pattern: 'teias\.gov\.tr/duyurular/[a-z0-9-]+$'
      exclude_title_pattern: 'Personel|İşçi|Sınav|Mülakat|Atama|Kura'
      doc_type: DUYURU
      institution: Türkiye Elektrik İletim A.Ş.

  # ---- Otomatik izlenemeyen kaynaklar (kayıt amaçlı) ----
  - key: epdk_elektrik_kurul_kararlari
    name: EPDK – Elektrik Piyasası Kurul Kararları listesi
    url: https://www.epdk.gov.tr/Detay/Icerik/3-0-39-3/son-kurul-kararlari/elektrik
    category: Düzenleyici kurum
    method: epdk_kararlar
    notes: >
      Liste sayfada hazır gelmez; kategori yaprakları sayfa içi AJAX (POST /Detay/GetFastAccessList) ile
      yüklenir. Kararlar karar numarasıyla tekilleştirilir; Resmî Gazete'de de yayımlananlar tek kayıt olur.
      İlk çalıştırmada bulunanlar başlangıç sayılır ve raporlanmaz.
    config:
      page_url: https://www.epdk.gov.tr/Detay/Icerik/3-0-39-3/son-kurul-kararlari/elektrik
      post_url: https://www.epdk.gov.tr/Detay/GetFastAccessList
      download_url: https://www.epdk.gov.tr/Detay/DownloadDocument?id=
      prefer_file_type: 2   # IsFileType tercihi; bulunamazsa diğeri, o da yoksa ilk belge alınır (tür içerikten anlaşılır)
      max_age_days: 120     # karar tarihi bundan eski kayıtlar alınmaz
      institution: Enerji Piyasası Düzenleme Kurumu

  - key: mevzuat_bilgi_sistemi
    name: Mevzuat Bilgi Sistemi – konsolide metinler
    url: https://www.mevzuat.gov.tr/
    category: Konsolide metinler
    method: mevzuat_konsolide
    notes: >-
      Arayüz JavaScript ile çalışır; metin sunucuda üretilen iframe sayfasından (MevzuatFihristDetayIframe) alınır.
      İlk taramada her mevzuatın maddeleri taban olarak saklanır; sonra bir madde değişirse eski–yeni
      karşılaştırmasıyla "konsolide metin güncellendi" kaydı açılır. Site değişikliği RG'den birkaç gün-hafta
      sonra işler; asıl bildirim Resmî Gazete kaynağından gelir.
    config:
      institution: Mevzuat Bilgi Sistemi (Cumhurbaşkanlığı)
      # tur: 1 Kanun, 7 Yönetmelik (Bakanlık/kurum), 9 Tebliğ, 19 CB Kararnamesi, 21 Kurum ve Kuruluş Yönetmeliği.
      # mevzuat_no ve tur, mevzuat.gov.tr'deki adresten okunur: /mevzuat?MevzuatNo=6446&MevzuatTur=1&MevzuatTertip=5
      # ('no' yerine 'mevzuat_no' kullanılır: YAML çıplak 'no' anahtarını false olarak okur.)
      items:
        - {mevzuat_no: 6446, tur: 1, name: Elektrik Piyasası Kanunu}
        - {mevzuat_no: 4646, tur: 1, name: Doğal Gaz Piyasası Kanunu}
        - {mevzuat_no: 5015, tur: 1, name: Petrol Piyasası Kanunu}
        - {mevzuat_no: 5307, tur: 1, name: Sıvılaştırılmış Petrol Gazları (LPG) Piyasası Kanunu}
        - {mevzuat_no: 5346, tur: 1, name: Yenilenebilir Enerji Kaynaklarının Elektrik Enerjisi Üretimi Amaçlı Kullanımına İlişkin Kanun}
        - {mevzuat_no: 5627, tur: 1, name: Enerji Verimliliği Kanunu}
        - {mevzuat_no: 7552, tur: 1, name: İklim Kanunu}
        - {mevzuat_no: 4628, tur: 1, name: Enerji Piyasası Düzenleme Kurumunun Teşkilat ve Görevleri Hakkında Kanun}
        - {mevzuat_no: 18985, tur: 7, name: Elektrik Piyasası Lisans Yönetmeliği}
        - {mevzuat_no: 12985, tur: 7, name: Elektrik Piyasası Dengeleme ve Uzlaştırma Yönetmeliği}
        - {mevzuat_no: 31502, tur: 7, name: Elektrik Piyasasında Lisanssız Elektrik Üretim Yönetmeliği}
        - {mevzuat_no: 24630, tur: 7, name: Elektrik Piyasası Tüketici Hizmetleri Yönetmeliği}
        - {mevzuat_no: 24112, tur: 7, name: Elektrik Piyasası Yan Hizmetler Yönetmeliği}
        - {mevzuat_no: 39153, tur: 7, name: Elektrik Piyasası Kapasite Mekanizması Yönetmeliği}
        - {mevzuat_no: 19357, tur: 7, name: Elektrik Piyasası Bağlantı ve Sistem Kullanım Yönetmeliği}
        - {mevzuat_no: 40876, tur: 7, name: Organize Sanayi Bölgelerinin ve Endüstri Bölgelerinin Elektrik Piyasası Faaliyetlerine İlişkin Yönetmelik}
        - {mevzuat_no: 5717, tur: 7, name: Doğal Gaz Piyasası Lisans Yönetmeliği}
        - {mevzuat_no: 5712, tur: 7, name: Doğal Gaz Piyasası Dağıtım ve Müşteri Hizmetleri Yönetmeliği}
        - {mevzuat_no: 22932, tur: 7, name: Doğal Gaz Piyasası Tarifeler Yönetmeliği}
        - {mevzuat_no: 5719, tur: 7, name: Petrol Piyasası Lisans Yönetmeliği}
        - {mevzuat_no: 24729, tur: 7, name: Enerji Verimliliği Denetim Yönetmeliği}
