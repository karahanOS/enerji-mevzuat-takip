# Başlıkta geçerse, başlıkta başka bir olumlu kök yoksa belge ilgisiz sayılır.
negative_title_patterns:
  - üniversitesi
  - yükseköğretim
  - lisansüstü
  - önlisans ve lisans eğitim
  - eğitim-öğretim
  - öğrenci
  - atama karar
  - kamulaştır
  - imar plan
  - ilaç
  - tıbbi cihaz
  - veteriner
  - sınav yönetmeliğ
  - görevde yükselme
  - personel alım
  - vakıf
  - müze
  - spor
  - noterlik
  - diyanet
  - karayolu taşıma
  - gümrük

# Bu bölümlerdeki belgeler analiz edilmez (yalnızca kayıt altına alınır)
skip_sections:
  - ILAN

# Bu belge türleri başlıkta eşleşme yoksa metin taramasına alınır
text_check_doc_types:
  - KANUN
  - CB_KARARNAMESI
  - CB_KARARI
  - GENELGE
  - KURUL_KARARI
  - AYM_KARARI
  - YONETMELIK
  - TEBLIG
  - KARAR
  - ANDLASMA

# Metin taramasında "ilgili" sayılmak için gereken asgari farklı kök sayısı
text_min_distinct_hits: 3

# Rutin karar ayrımı: tek şirkete/tesise özgü kurul kararları AI kotası harcanmadan
# "rutin" bölümünde listelenir. Piyasa geneli göstergeleri varsa rutin sayılmaz.
routine:
  doc_types: [KURUL_KARARI, KARAR]
  max_chars: 6000
  company_markers:
    - "a.ş."
    - anonim şirket
    - "ltd. şti"
    - limited şirket
  patterns:
    - lisansının tadil
    - lisans tadil
    - lisansının sona erdiril
    - lisansının iptal
    - lisans süresinin uzatıl
    - süresinin uzatılmasına
    - önlisans
    - lisans verilmesine
    - unvan değişikliğ
    - pay devri
    - hisse devri
    - kapasite artış
    - tesis tamamlanma süre
    - idari para cezası verilmesine
    - üretim lisans
  # Tek bir lisans sahibinin tarifesini revize eden kararlar: gerekçede geçen "usul ve esas/metodoloji" ifadesi
  # piyasa geneli anlamına gelmez; aşağıdaki işaretçi ve kalıp birlikte varsa engelleyiciler yok sayılır.
  company_specific_markers:
    - lisansı sahibi
  company_specific_patterns:
    - tarifelerine yönelik alınmış olan
    - tarifesine yönelik alınmış olan
    - kurul kararının aşağıda yer verildiği şekilde revize
  market_wide_markers:
    - tüm piyasa katılımcı
    - usul ve esas
    - yönetmeliğ
    - tarife tablo
    - azami uzlaştırma
    - fiyat limit
    - "=yekdem"
    - yöntem
    - metodoloji
    - bedellerinin
    - tüm dağıtım şirket
    - genel aydınlatma
