# Enerji mevzuatı ilgililik taksonomisi
# ------------------------------------------------------------------
# Eşleştirme Türkçe küçük harfe çevrilmiş metin üzerinde, kelime başından
# itibaren KÖK eşleşmesiyle yapılır: "dengeleme" kökü dengelemenin, dengelemeye...
# Başında "=" olan kökler TAM KELİME eşleşir ("=ptf" → "ptf" evet, "ptfx" hayır).
# core: true  → ana ilgi alanı; önem puanına +1 ekler.
# weak: true  → başlıkta tek başına "ilgili" saydırmaz, metin kontrolüne yönlendirir.

